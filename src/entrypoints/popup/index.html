<!doctype html>
<html lang="en" data-elt-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Endstep Light Theme</title>
  <meta name="manifest.type" content="browser_action" />
</head>

<body>
  <main>
    <header>
      <h1>Endstep Light Theme</h1>
    </header>

    <section>
      <p id="description">
        A light accessible theme for <a href="https://endstep.cc" target="_blank" rel="noopener noreferrer"
          class="link">endstep.cc</a>.
      </p>


      <form id="theme-form">
        <fieldset class="theme-selector">
          <legend class="visually-hidden">Theme</legend>

          <input type="radio" id="light" name="theme" value="light" class="visually-hidden" checked />
          <label for="light">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" height="24px" width="24px" fill="#423c35">
              <path d="M11,5V1h2V5H11Zm6.65,2.75L16.28,6.38l2.8-2.88l1.4,1.43L17.65,7.75ZM19,13V11h4v2H19ZM11,23V19h2v4H11ZM6.35,7.7L3.5,4.93l1.43-1.4L7.75,6.35L6.35,7.7Zm12.7,12.8l-2.77-2.88l1.35-1.35l2.85,2.75L19.05,20.5ZM1,13V11H5v2H1Zm3.93,7.5l-1.4-1.43l2.8-2.8l0.73,0.68l0.72,0.7L4.93,20.5Zm2.82-4.25Q6,14.5 6,12T7.75,7.75T12,6t4.25,1.75T18,12t-1.75,4.25T12,18T7.75,16.25Zm7.08-1.43Q16,13.65 16,12T14.83,9.17T12,8T9.18,9.17T8,12t1.18,2.82T12,16t2.83-1.18ZM12,12Z" />
            </svg>
            <span class="visually-hidden">Light</span>
          </label>

          <input type="radio" id="dark" name="theme" value="dark" class="visually-hidden" />
          <label for="dark">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" height="24px" width="24px" fill="#423c35"><path d="M14,22q-2.05,0-3.88-0.79Q8.3,20.43 6.94,19.06Q5.58,17.7 4.79,15.88T4,11.99T4.79,8.11T6.94,4.94t3.19-2.15T14,2q1.35,0 2.63,0.35t2.38,1q-2.27,1.32-3.64,3.59T14,12t1.36,5.06T19,20.65q-1.1,0.65-2.38,1T14,22Zm0-2q0.28,0 0.53,0T15,19.95q-1.42-1.65-2.21-3.69Q12,14.23 12,12q0-2.23 0.79-4.26T15,4.05Q14.78,4 14.53,4T14,4Q10.68,4 8.34,6.34T6,12t2.34,5.66T14,20Zm-2-8Z"/></svg>
            <span class="visually-hidden">Dark</span>
          </label>
        </fieldset>
      </form>
    </section>

    <footer>
      <i id="version">v1.0</i>

      <a href="https://github.com/gabrieledarrigo/endstep-light-theme/issues" target="_blank"
        title="Provide feedback or report issues" class="link">
        Feedback or issues
      </a>
    </footer>
  </main>
  <script type="module" src="./main.ts"></script>
</body>

</html>
